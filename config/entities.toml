# Entity vocabulary for the keyword gate and for scoring.
#
# The gate is crude on purpose: it exists to keep the API bill near zero, not to
# be accurate. Accuracy is the scorer's job, one stage later. An item matching
# zero entities AND zero themes never reaches the scorer.
#
# Matching is case-insensitive substring on title + snippet.

# Own companies and brands. Highest weight — a story naming us is almost always
# worth a look even when the theme is dull.
