# Candidate feeds to probe. Nothing here is trusted until scripts/check_feeds.py
# confirms it responds — run `uv run scripts/check_feeds.py --write` to produce
# config/feeds.toml containing only the ones that actually answered.
#
# All sources must be free and publicly accessible. No paywalled or licensed feeds.
#
# FINDING (2026-09-03, step 1): the three most valuable trade publications —
# Estate Nyheter, Byggeindustrien (bygg.no) and Kommunal Rapport — have all
# removed their public RSS feeds. Every documented path returns 404 and none
# advertise a rel="alternate" feed. They are reachable instead through
# site:-scoped Google News queries, which return same-day items. Those queries
# are the "bransje" entries below; keep them until the publishers restore feeds.

