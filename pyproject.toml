[project]
name = "nyhetsradar"
version = "0.1.0"
description = "News monitor for Selvaag Eiendom — collects Norwegian property-sector RSS, deduplicates, ranks, and serves a weekly brief."
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "feedparser>=6.0",
    "python-dotenv>=1.0",
    "gunicorn>=23.0",
]

[project.optional-dependencies]
# Only needed for LLM summaries and the "derfor er dette relevant" paragraph.
# Without it the pipeline runs on keyword ranking alone.
llm = ["anthropic>=0.40"]

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nyhetsradar"]
