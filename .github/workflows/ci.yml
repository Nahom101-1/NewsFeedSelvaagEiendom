name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # setup-uv publishes floating major tags only up to v7; v8 and later
        # exist as exact tags only, so this must be pinned precisely.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q

  config-integrity:
    name: Config integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # setup-uv publishes floating major tags only up to v7; v8 and later
        # exist as exact tags only, so this must be pinned precisely.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --frozen

      # The tuning surface is the thing most likely to be edited by hand, and a
      # malformed TOML file breaks the pipeline at collection time rather than
      # at edit time. Parse it here instead.
      - name: Parse config files
        run: |
          uv run python - <<'PY'
          import sys, tomllib
          from pathlib import Path

          failed = False
          for path in sorted(Path("config").glob("*.toml")):
              try:
                  tomllib.loads(path.read_text())
                  print(f"ok   {path}")
              except tomllib.TOMLDecodeError as exc:
                  print(f"FAIL {path}: {exc}")
                  failed = True

          feeds = tomllib.loads(Path("config/feeds.toml").read_text()).get("feed", [])
          print(f"\n{len(feeds)} active feeds")
          if not feeds:
              print("FAIL config/feeds.toml has no active feeds")
              failed = True
          for feed in feeds:
              missing = {"name", "url", "type"} - feed.keys()
              if missing:
                  print(f"FAIL {feed.get('name', '?')} missing {missing}")
                  failed = True

          if not Path("config/profile.md").read_text().strip():
              print("FAIL config/profile.md is empty")
              failed = True

          sys.exit(1 if failed else 0)
          PY

      # Proves the pipeline is wired end to end without touching the network:
      # a temporary database, three synthetic items, then dedup and score.
      - name: Smoke test pipeline against a temporary database
        env:
          DATABASE_PATH: /tmp/ci-news.db
        run: |
          uv run python - <<'PY'
          from datetime import UTC, datetime
          from nyhetsradar import db

          conn = db.init()
          now = datetime.now(UTC).isoformat()
          titles = [
              "Selvaag Eiendom kjoper tomt i Oslo",
              "Selvaag Eiendom kjopte tomten i Oslo",
              "Helt urelatert sak om matlaging",
          ]
          conn.executemany(
              "INSERT OR IGNORE INTO items (link,title,snippet,source,source_type,"
              "published_at,collected_at) VALUES (?,?,?,?,?,?,?)",
              [
                  (f"https://example.test/{i}", t, "", "CI", "test", now, now)
                  for i, t in enumerate(titles)
              ],
          )
          conn.commit()
          PY
          uv run python -m nyhetsradar.dedup
          uv run python -m nyhetsradar.score

      - name: Assert the gate blocked the irrelevant item
        env:
          DATABASE_PATH: /tmp/ci-news.db
        run: |
          uv run python - <<'PY'
          import sys
          from nyhetsradar import db

          conn = db.connect()
          blocked = conn.execute(
              "SELECT COUNT(*) FROM items WHERE gated = 0 AND title LIKE '%matlaging%'"
          ).fetchone()[0]
          passed = conn.execute(
              "SELECT COUNT(*) FROM items WHERE gated = 1 AND title LIKE '%Selvaag%'"
          ).fetchone()[0]
          print(f"blocked irrelevant: {blocked}, passed relevant: {passed}")
          sys.exit(0 if blocked == 1 and passed >= 1 else 1)
          PY

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Type errors are build errors in Next, so this covers tsc too.
      - name: Build
        run: npm run build

  docker:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: nyhetsradar:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image is only useful if the app actually answers. Start it against
      # an empty database and check the health endpoint reports ok.
      - name: Start container and check health
        run: |
          docker run -d --name nyhetsradar-ci -p 8000:8000 nyhetsradar:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz; then
              printf '\nhealthy after %ss\n' "$i"
              exit 0
            fi
            sleep 1
          done
          echo "container never became healthy"
          docker logs nyhetsradar-ci
          exit 1

      # Flask is a JSON API now; the UI is the Next.js app in web/.
      - name: Check the API answers
        run: |
          for path in /api/brief /api/admin; do
            code=$(curl -s -o "/tmp/$(basename "$path").json" -w '%{http_code}' \
              "http://localhost:8000$path")
            echo "$path -> HTTP $code"
            test "$code" = "200"
          done
          # Assert real shape, not just a 200: an empty database must still
          # return the keys the frontend destructures.
          python3 -c "
          import json, sys
          brief = json.load(open('/tmp/brief.json'))
          admin = json.load(open('/tmp/admin.json'))
          assert {'stories','kpis','threshold','generated_at'} <= brief.keys(), brief.keys()
          assert {'totals','distribution','labels'} <= admin.keys(), admin.keys()
          assert len(admin['distribution']) == 10
          print('brief and admin payloads OK')
          "

      - name: Container logs
        if: always()
        run: docker logs nyhetsradar-ci || true

  stack:
    name: Production stack
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      # The Caddyfile is never exercised locally — no Caddy on the dev machine
      # — so a typo would only surface on the first real deploy.
      - name: Validate Caddyfile
        run: |
          docker run --rm \
            -e DOMAIN=example.com \
            -e BASIC_AUTH_USER=radar \
            -e BASIC_AUTH_HASH='$2a$14$abcdefghijklmnopqrstuv' \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

      # Builds both images and wires them exactly as compose.prod.yaml does.
      # This is what catches an api/web port mismatch, which is otherwise
      # invisible until the site is up and the page says it cannot reach the
      # server.
      - name: Build both images
        run: |
          docker build -t nyhetsradar-api:ci .
          docker build -t nyhetsradar-web:ci \
            --build-arg FLASK_ORIGIN=http://api:8000 ./web

      - name: Run api and web on one network
        run: |
          docker network create radar
          docker run -d --name api --network radar --network-alias api nyhetsradar-api:ci
          docker run -d --name web --network radar -p 3000:3000 \
            -e FLASK_ORIGIN=http://api:8000 nyhetsradar-web:ci
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:3000/ >/dev/null 2>&1; then
              echo "web up after ${i}s"; break
            fi
            sleep 1
          done

      - name: The page must render, and reach the API through the network
        run: |
          curl -sS http://localhost:3000/ -o /tmp/page.html
          echo "$(wc -c < /tmp/page.html) bytes"
          # An empty database still renders; what must NOT appear is the
          # "cannot reach the server" fallback, which is how a broken
          # web -> api link shows up.
          if grep -qi "Får ikke kontakt med serveren" /tmp/page.html; then
            echo "FAIL: web container cannot reach the api container"
            docker logs web; docker logs api
            exit 1
          fi
          grep -qi "Nyheter denne uken" /tmp/page.html
          curl -fsS http://localhost:3000/admin -o /dev/null
          echo "reader page and admin page both render against the api"

      - name: Logs
        if: always()
        run: |
          docker logs api || true
          docker logs web || true
